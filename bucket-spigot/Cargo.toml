[package]
name = "bucket-spigot"
version = "0.1.0"
authors = ["Daniel Lambert <danjl1100@gmail.com>"]
edition = "2024"
license = "GPL-3.0-or-later"

[features]
default = ["ts-rs"]
ts-rs = ["dep:ts-rs"]

[lints]
workspace = true

[dependencies]
rand = "0.8.5"
rand_next = { version = "0.10.0", package = "rand" }
clap = { version = "4.5.4", features = ["derive"] }
serde = { version = "1.0.199", features = ["derive"] }
arbitrary = "1.3.2"
ts-rs = { version = "11.0.1", optional = true }

[dev-dependencies]
arbtest = "0.3.1"
eyre = "0.6.12"
insta = { version = "1.39.0", features = ["ron"] }
serde_json = "1.0.116"
arg_util = { path = "../arg-util" }
arbitrary = { version = "1.3", features = ["derive"] }
