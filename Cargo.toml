[workspace]
members = [ "crates/arg-util", "crates/beet-pusher", "crates/beet-pusher-webui", "crates/bucket-spigot", "crates/fake-beet", "crates/fake-vlc", "crates/shared", "crates/spigot-visual", "crates/stdio-test", "crates/vlc-http", "crates/vlc-http-auth", "crates/vlc-http-auth-clap", "crates/vlc-http-cmd", "crates/vlc-http-cmd-clap", "crates/vlc-http-test", "crates/vlc-http-ureq", "crates/xtask" ]
resolver = "2"


[workspace.lints.clippy]
# teach me
pedantic = { level = "warn", priority = -1}
# except this confusing pattern
bool_to_int_with_if = { level = "allow", priority = 1}
# ok to ignore with no reason
ignore_without_reason = { level = "allow", priority = 1}

# no unwrap
unwrap_used = "deny"
# no panic
panic = "deny"
# document why lints are allowed on case-by-case basis
allow_attributes_without_reason = "warn"

[workspace.lints.rust]
# docs!
missing_docs = "deny"
# no unsafe
unsafe_code = "forbid"

[workspace.lints.rustdoc]
# docs!
broken_intra_doc_links = "deny"


# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[workspace.dependencies]
