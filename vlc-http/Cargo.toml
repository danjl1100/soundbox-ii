[package]
name = "vlc-http"
version = "0.1.0"
authors = ["Daniel Lambert <danjl1100@gmail.com>"]
edition = "2024"
license = "GPL-3.0-or-later"

[lints]
workspace = true

[features]
default = ["clap", "ureq"]
clap = ["dep:clap"]
ureq = ["dep:ureq"]

[dependencies]
base64 = "0.22.1"
clap = { version = "4.5.4", optional = true, features = ["derive", "env"] }
http = "1.1.0"
serde = { version = "1.0.199", features = ["derive"] }
serde_json = "1.0.116"
tracing = "0.1.40"
ureq = { version = "2.9.7", features = ["http-crate"], default-features = false, optional = true }
url = { version = "2.5.0", features = ["serde"] }
urlencoding = "2.1.3"

[dev-dependencies]
arbitrary = { version = "1.4.2", features = ["derive"] }
arbtest = "0.3.2"
clap = { version = "4.5.4", features = ["derive"] }
eyre = "0.6.12"
insta = { version = "1.38.0", features = ["ron", "glob"] }
test-log = { version = "0.2.16", default-features = false, features = ["color", "trace"] }
tracing-subscriber = "0.3.22"
ureq = { version = "2.9.7", features = [], default-features = false }

