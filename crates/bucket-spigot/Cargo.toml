[package]
name = "bucket-spigot"
version = "0.1.0"
edition = "2024"
authors.workspace = true
license.workspace = true
publish.workspace = true

[features]
default = ["ts-rs"]
ts-rs = ["dep:ts-rs"]

[lints]
workspace = true

[dependencies]
rand = "0.8.5"
# TODO: pending removal of non-optional WASI dependencies,
# see <https://github.com/rust-random/getrandom/pull/830>
# rand_next = { version = "0.10.0", package = "rand" }
clap = { version = "4.5.4", features = ["derive"] }
serde = { version = "1.0.199", features = ["derive"] }
arbitrary = "1.3.2"
ts-rs = { version = "11.0.1", optional = true }
thiserror = "2.0.20"
ref-cast = "1.0.27"

[dev-dependencies]
arbtest = "0.3.1"
eyre = "0.6.12"
insta = { version = "1.39.0", features = ["ron"] }
serde_json = "1.0.116"
arg_util = { path = "../arg-util" }
arbitrary = { version = "1.3", features = ["derive"] }
