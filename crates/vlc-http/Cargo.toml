[package]
name = "vlc-http"
version = "0.1.0"
authors = ["Daniel Lambert <danjl1100@gmail.com>"]
edition = "2024"
license = "GPL-3.0-or-later"

[lints]
workspace = true

[dependencies]
serde = { version = "1.0.199", features = ["derive"] }
serde_json = "1.0.116"
tracing = "0.1.40"
urlencoding = "2.1.3"
vlc-http-auth = { version = "0.1.0", path = "../vlc-http-auth" }
vlc-http-cmd = { version = "0.1.0", path = "../vlc-http-cmd" }

[dev-dependencies]
arbitrary = { version = "1.4.2", features = ["derive"] }
arbtest = "0.3.2"
arg_util = { path = "../arg-util" }
clap = { version = "4.5.4", features = ["derive"] }
eyre = "0.6.12"
insta = { version = "1.38.0", features = ["ron", "glob"] }
test-log = { version = "0.2.16", default-features = false, features = ["color", "trace"] }
tracing-subscriber = "0.3.22"
vlc-http-auth-clap = { path = "../vlc-http-auth-clap" }
vlc-http-cmd-clap = { path = "../vlc-http-cmd-clap" }
vlc-http-ureq = { path = "../vlc-http-ureq" }

