[package]
name = "beet-pusher-webui"
version = "0.1.0"
edition = "2024"
authors.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
axum = { version = "0.8.9", features = ["macros", "ws"] }
beet-pusher = { version = "0.1.0", path = "../beet-pusher" }
config = { version = "0.15.23", default-features = false }
eyre = "0.6.12"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
thiserror = "2.0.18"
tokio = { version = "1.52.3", features = ["net", "rt-multi-thread"] }
tower = "0.5.3"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["json", "std"] }
utoipa = "5.5.0"
utoipa-swagger-ui = { version = "9.0.2", default-features = false, features = ["axum", "vendored"] }
validator = { version = "0.20.0", features = ["derive"] }

[lints]
workspace = true

[dev-dependencies]
insta = { version = "1.48.0", features = ["json"] }
stdio-test = { path = "../stdio-test" }
ureq = { version = "3.3.0", default-features = false }
