[package]
name = "beet-pusher"
version = "0.1.0"
authors = ["Daniel Lambert <danjl1100@gmail.com>"]
edition = "2024"
license = "GPL-3.0-or-later"

[lints]
workspace = true

[dependencies]
arg_util = { version = "0.1.0", path = "../arg-util" }
bucket-spigot = { version = "0.1.0", path = "../bucket-spigot" }
clap = { version = "4.5.4", features = ["derive"] }
eyre = "0.6.12"
percent-encoding = "2.3.1"
rand = "0.8.5"
serde = { version = "1.0.215", features = ["derive"] }
serde_json = "1.0.149"
thiserror = "2.0.18"
toml = "0.8.19"
tracing = "0.1.40"
tracing-subscriber = { version = "0.3.18", features = ["env-filter"] }
url = "2.5.3"
vlc-http = { version = "0.1.0", path = "../vlc-http" }
vlc-http-auth-clap = { version = "0.1.0", path = "../vlc-http-auth-clap" }
vlc-http-ureq = { version = "0.1.0", path = "../vlc-http-ureq" }
oneshot = { version = "0.2.1", features = ["std"] }

[dev-dependencies]
fake-beet = { path = "../fake-beet" }
fake-vlc = { path = "../fake-vlc" }
insta = "1.47.2"
stdio-test = { path = "../stdio-test" }
tempfile = "3.27.0"
urlencoding = "2.1.3"
vlc-http-auth = { path = "../vlc-http-auth" }
vlc-http-test = { path = "../vlc-http-test" }
